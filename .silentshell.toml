setup = "./tests/agent-setup.sh"
ignore-paths = [".test-ignore-paths", ".venv"]

[container]
name = "silentshell"
image_name = "silentshell_dev_env"
image_dockerfile = "./config/claude.Dockerfile"
image_user = "mary"

[container.volumes]
"~/.claude"="/home/mary/.claude"
"~/.claude.json"="/home/mary/.claude.json"

[env]
PYTHONDONTWRITEBYTECODE=1
SILENTSHELL_TEST_ENV = "lorem-ipsum"
