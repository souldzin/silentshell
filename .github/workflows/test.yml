name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: config/claude.Dockerfile
          load: true
          tags: silentshell_dev_env:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        run: ./tests/test-environment.sh
